<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fale Conosco | Companhia de Rafting em Corredeiras</title>

    <meta
        name="description"
        content="Fale com a Companhia de Rafting em Corredeiras em Curitiba. Veja endereço, telefone e e-mail, e envie dúvidas, perguntas sobre reservas ou sugestões."
    >
    <meta name="author" content="Matías Marcelo Yapura">

    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>

        <img
            src="imagens/logo_rafting.png"
            alt="Logotipo da empresa de rafting"
        >

        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>

    </header>

    <main>

        <section class="empresa">

            <h1>Companhia de Rafting em Corredeiras</h1>

            <p>
                Av. Sete de Setembro, 3399<br>
                Curitiba, Paraná<br>
                <a href="tel:+5541999999999">+55 41 99999-9999</a><br>
                <a href="mailto:info@correiras.com">info@correiras.com</a>
            </p>

        </section>

        <section class="contato-grade">

            <iframe
                class="mapa"
                src="https://maps.google.com/maps?q=Av.+Sete+de+Setembro,+3399,+Curitiba,+Paran%C3%A1&amp;hl=pt&amp;z=16&amp;output=embed"
                title="Mapa da sede da Companhia de Rafting em Corredeiras na Av. Sete de Setembro, 3399, Curitiba"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
            ></iframe>

            <form class="formulario" action="contato.html" method="post">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite aqui"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite aqui"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo campo-motivo">
                    <span id="rotulo-motivo">Propósito da Mensagem</span>
                    <div class="radios" role="radiogroup" aria-labelledby="rotulo-motivo">
                        <label for="consulta-geral">
                            <input
                                type="radio"
                                id="consulta-geral"
                                name="motivo"
                                value="consulta-geral"
                                required
                            >
                            Consulta Geral
                        </label>
                        <label for="pergunta-reserva">
                            <input
                                type="radio"
                                id="pergunta-reserva"
                                name="motivo"
                                value="pergunta-reserva"
                            >
                            Pergunta sobre Reserva
                        </label>
                        <label for="sugestao-site">
                            <input
                                type="radio"
                                id="sugestao-site"
                                name="motivo"
                                value="sugestao-site"
                            >
                            Sugestão de Site
                        </label>
                    </div>
                </div>

                <div class="campo campo-mensagem">
                    <label for="mensagem">Mensagem</label>
                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="4"
                        placeholder="Digite aqui"
                        required
                    ></textarea>
                </div>

                <div class="campo-check">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Quero receber a newsletter mensal</label>
                </div>

                <button type="submit">Entrar em Contato!</button>

            </form>

        </section>

        <section class="equipe">

            <h2>Estamos Aqui para Serví-lo</h2>

            <div class="perfis">

                <figure>
                    <img
                        src="imagens/historia.jpg"
                        alt="Guia-chefe com a equipe em um bote de rafting"
                    >
                    <figcaption>Marina Alves<br>Guia-chefe</figcaption>
                </figure>

                <figure>
                    <img
                        src="imagens/rafting_2.jpg"
                        alt="Coordenador de segurança acompanhando um grupo no rio"
                    >
                    <figcaption>Paulo Nogueira<br>Coordenador de segurança</figcaption>
                </figure>

                <figure>
                    <img
                        src="imagens/aventura2.jpg"
                        alt="Atendente orientando clientes durante um passeio de rafting"
                    >
                    <figcaption>Helena Duarte<br>Atendimento ao cliente</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>
            © 2026 Aventura das Águas | Matías Marcelo Yapura
        </p>

        <nav class="redes-sociais">

            <a href="https://facebook.com">
                <img
                    src="imagens/icon-facebook.svg"
                    alt="Ícone do Facebook"
                >
            </a>

            <a href="https://linkedin.com">
                <img
                    src="imagens/icon-linkedin.svg"
                    alt="Ícone do LinkedIn"
                >
            </a>

            <a href="https://instagram.com">
                <img
                    src="imagens/icon-instagram.svg"
                    alt="Ícone do Instagram"
                >
            </a>

        </nav>

    </footer>

</body>

</html>
